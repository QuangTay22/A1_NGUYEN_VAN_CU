<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tạo tài khoản | Ngôi nhà của những ước mơ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-layout single-column">
    <section class="card auth-card">
      <form id="signup-form" novalidate>
        <h2>Tạo tài khoản mới</h2>
        <label class="sr-only" for="signup-email">Email</label>
        <input id="signup-email" type="email" placeholder="Email" required />

        <label class="sr-only" for="signup-password">Mật khẩu</label>
        <input id="signup-password" type="password" placeholder="Password" required />

        <label class="sr-only" for="signup-confirm-password">Xác nhận mật khẩu</label>
        <input id="signup-confirm-password" type="password" placeholder="Confirm password" required />

        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
      <div class="divider"></div>
      <button id="go-login" type="button" class="btn btn-light">Quay lại đăng nhập</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
